{% extends "base.html" %}
{% block title %}{{ post.title }} — SurfaceWatch Blog{% endblock %}
{% block content %}
<div class="mt-8 card rounded-xl p-8">
  <h1 class="text-2xl font-bold mb-2">{{ post.title }}</h1>
  <p class="text-sm text-gray-500 mb-6">by {{ post.author.username }} · {{ post.created_at.strftime('%b %d, %Y') }}</p>
  <div class="text-gray-300 whitespace-pre-line">{{ post.content }}</div>
</div>
{% endblock %}
