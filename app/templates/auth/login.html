{% extends "base.html" %}
{% block title %}Log In — SurfaceWatch{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12">
  <div class="card rounded-2xl p-8 shadow-xl">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-500 mx-auto flex items-center justify-center text-2xl mb-2">
        🛡️
      </div>
      <h1 class="text-2xl font-bold">Log In to SurfaceWatch</h1>
      <p class="text-xs opacity-70 mt-1">Access your attack surface scans and dashboard</p>
    </div>

    <form method="POST" class="space-y-4">
      <div>
        <label class="text-xs font-semibold opacity-80 block mb-1">Email Address</label>
        <input type="email" name="email" required placeholder="name@company.com" class="w-full rounded-xl px-4 py-2.5 text-sm">
      </div>

      <div>
        <label class="text-xs font-semibold opacity-80 block mb-1">Password</label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full rounded-xl px-4 py-2.5 text-sm">
      </div>

      <button type="submit" class="btn-primary w-full text-white py-3 rounded-xl font-semibold text-sm shadow-md transition mt-2">
        Log In
      </button>
    </form>

    <p class="text-xs opacity-70 mt-6 text-center">
      Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-indigo-400 hover:underline font-semibold">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
